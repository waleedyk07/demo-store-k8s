apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: store-ingress
  namespace: prod-core
  annotations:
    # Strip the /api prefix: /api/products/ -> store-be /products/
    nginx.org/rewrites: "serviceName=store-be-service rewrite=/"
spec:
  ingressClassName: nginx # nginx.org/ingress-controller
  rules:
  # - host: localhost # controller runs with -allow-empty-ingress-host=false
  - host: demo-store.com # controller runs with -allow-empty-ingress-host=false
    http:
      paths:
      - path: /api/
        pathType: Prefix
        backend:
          service:
            name: store-be-service
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: store-fe-service
            port:
              number: 80
